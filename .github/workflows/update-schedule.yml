name: 공연 일정 갱신

on:
  schedule:
    - cron: "10 18 * * *"   # 매일 03:10 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 의존성
        run: pip install "pandas==2.2.3" "numpy==2.1.3"
      - name: 누리집 공연 일정 → 공연 목록·구독 피드
        run: python build/update_schedule.py . "https://olpark-alarm.github.io/"
      - name: 바뀐 것만 커밋
        run: |
          git config user.name "olpark-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json data/meta.json feeds/
          if git diff --cached --quiet; then echo "변경 없음"; else git commit -m "공연 일정 갱신 $(TZ=Asia/Seoul date +%F)" && git push; fi
